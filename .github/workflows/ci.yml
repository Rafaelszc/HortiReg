name: CI

on:
  push:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  API_DIR: sgv-wa/sgv-wa
  # Valores só de teste; nunca os de produção. Gemini e Evolution API são mockados nos testes.
  # JWT_SECRET é gerado em cada job (passo "Gerar segredo de teste").
  DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/hortireg_test
  ADMIN_LOGIN: admin
  ADMIN_PASSWORD: senha-de-teste-123

jobs:
  # CT-60: falha com segredo no repositório
  secrets:
    name: Segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # CT-02 / CT-60: falha com dependência vulnerável ou código inseguro
  security:
    name: Segurança (bandit, pip-audit, npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: sgv-wa/sgv-wa/requirements*.txt
      - name: Instalar ferramentas
        run: pip install bandit pip-audit
      - name: bandit
        run: bandit -r $API_DIR/app -ll
      - name: pip-audit
        run: pip-audit -r $API_DIR/requirements.txt
      - uses: actions/setup-node@v4
        if: hashFiles('frontend/package-lock.json') != ''
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit
        if: hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  backend:
    name: API (ruff, pytest, pytest-bdd)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hortireg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d hortireg_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: sgv-wa/sgv-wa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: sgv-wa/sgv-wa/requirements*.txt
      - name: Gerar segredo de teste
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Testes com cobertura
        run: pytest --cov=app --cov-fail-under=80 --cov-report=xml --cov-report=term-missing --junitxml=report-pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorios-api
          path: |
            sgv-wa/sgv-wa/report-pytest.xml
            sgv-wa/sgv-wa/coverage.xml

  frontend:
    name: Painel (Cypress + Cucumber)
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hortireg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d hortireg_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verificar se o painel existe
        id: painel
        run: echo "existe=${{ hashFiles('frontend/package-lock.json') != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.painel.outputs.existe == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: sgv-wa/sgv-wa/requirements*.txt
      - uses: actions/setup-node@v4
        if: steps.painel.outputs.existe == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Gerar segredo de teste
        if: steps.painel.outputs.existe == 'true'
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Criar tabelas, admin e subir API
        if: steps.painel.outputs.existe == 'true'
        working-directory: sgv-wa/sgv-wa
        run: |
          pip install -r requirements.txt
          python -m app.seed
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$GITHUB_WORKSPACE/api.log" 2>&1 &
          curl --retry 15 --retry-connrefused --retry-delay 2 -sf http://127.0.0.1:8000/health
      - name: "Cypress (push: @smoke; PR: @smoke ou @regressao)"
        if: steps.painel.outputs.existe == 'true'
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          build: npm run build
          start: npm run preview -- --port 5173 --strictPort
          wait-on: "http://127.0.0.1:5173"
          browser: chrome
        env:
          TAGS: ${{ github.event_name == 'push' && '@smoke and not @wip' || '(@smoke or @regressao) and not @wip' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-evidencias
          path: |
            frontend/cypress/videos
            frontend/cypress/screenshots
            api.log
          if-no-files-found: ignore
