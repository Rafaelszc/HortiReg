[pytest]
asyncio_mode = auto
markers =
    smoke: cenários críticos rápidos
    regressao: suíte de regressão
    excecao: fluxos de exceção (mensagens de erro ao cliente)
    seguranca: controle de acesso e entradas maliciosas
    R2: cenários da Release 2
    US-08: cenários da US-08 (confirmação do pedido)
