[pytest]
asyncio_mode = auto
markers =
    smoke: cenários críticos rápidos
    regressao: suíte de regressão
    excecao: fluxos de exceção (mensagens de erro ao cliente)
    R2: cenários da Release 2
    US-05: cenários da US-05 (pedido por texto)
    US-06: cenários da US-06 (pedido por áudio)
    US-08: cenários da US-08 (confirmação do pedido)
    US-10: cenários da US-10 (expiração do pedido)
    seguranca: controle de acesso, autenticação e entrada maliciosa
